<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xyorla games</title>
    <style>
        :root {
            --jungle-dark: #0f380f;
            --jungle-mid: #2d5a27;
            --jungle-light: #8bbf71;
            --wood-dark: #3d2314;
            --wood-light: #8b5a2b;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--jungle-dark), var(--jungle-mid));
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            background-color: var(--wood-dark);
            width: 100%;
            padding: 20px 0;
            text-align: center;
            border-bottom: 5px solid var(--wood-light);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        h1 {
            margin: 0;
            color: var(--jungle-light);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .container {
            flex: 1;
            width: 90%;
            max-width: 960px;
            margin: 40px auto;
            background-color: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 15px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 2px solid var(--jungle-light);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .game-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 10px;
            border: 4px solid var(--wood-light);
            background-color: #000;
        }

        .game-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        footer {
            margin-top: auto;
            padding: 20px;
            text-align: center;
            font-size: 0.9em;
            color: var(--jungle-light);
        }
    </style>
</head>
<body>

    <header>
        <h1> welcome, this site is being improved for a better experience. </h1>
    </header>

    <div class="container">
        <div class="game-wrapper">
            <iframe src="https://example.com/your-game-link-here" title="Game Frame" allowfullscreen></iframe>
        </div>
    </div>

    <footer>
        <p>Welcome to the canopy. Game on.</p>
    </footer>

</body>
</html>
